html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: navy sidebar + lavender workspace. Dashboard = banner, 5 stat tiles, 3 charts, program cards beside a detail panel. */
:root{
  --bg:#f1f1fa; --surface:#ffffff; --surface-2:#f6f5fd; --fg:#1d1633; --muted:#686384; --line:#e5e2f3;
  --maroon:#0b4a8f; --maroon-2:#06284f; --gold:#f2c14e; --gold-ink:#3a2600;
  --violet:#6a4ce0; --blue:#2f8de4; --green:#27ad6a; --amber:#f2a01b; --pink:#ec5b9a;
  --violet-ink:#5238c4; --blue-ink:#1b64b0; --green-ink:#157a46; --amber-ink:#975900;
  --btn:#5b3fd6; --btn-ink:#ffffff; --danger:#c62f4b;
  --banner-a:#e9e4ff; --banner-b:#ffe8d6; --shadow:0 1px 2px rgba(60,30,110,.06),0 8px 24px rgba(60,30,110,.07);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-script:'Caveat','Segoe Script',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14101d; --surface:#1f1a2c; --surface-2:#271f37; --fg:#f0ecfb; --muted:#a8a2c2; --line:#352b4c;
  --violet:#9a82ff; --blue:#5aa8f0; --green:#3cc886; --amber:#f5b445; --pink:#f47fb2;
  --violet-ink:#b9a8ff; --blue-ink:#8cc4f7; --green-ink:#72dca6; --amber-ink:#f7c46a;
  --btn:#6d50ea; --banner-a:#2b2150; --banner-b:#3a2230; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14101d; --surface:#1f1a2c; --surface-2:#271f37; --fg:#f0ecfb; --muted:#a8a2c2; --line:#352b4c;
  --violet:#9a82ff; --blue:#5aa8f0; --green:#3cc886; --amber:#f5b445; --pink:#f47fb2;
  --violet-ink:#b9a8ff; --blue-ink:#8cc4f7; --green-ink:#72dca6; --amber-ink:#f7c46a;
  --btn:#6d50ea; --banner-a:#2b2150; --banner-b:#3a2230; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:linear-gradient(180deg,var(--maroon) 0%,var(--maroon-2) 100%);color:#fff;display:flex;flex-direction:column;gap:18px;
  padding:22px 14px 22px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:hidden}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:4px}
.brand img{width:84px;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.85}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#fff;padding:11px 14px;border-radius:12px;text-align:left;font-weight:500}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,#f6d57a,#eab949);color:var(--gold-ink);font-weight:700}
.side .tag{margin-top:auto;text-align:center}
.side .tag i{display:block;font-family:var(--f-script);font-style:normal;font-size:30px;line-height:1;color:#f6d57a;transform:rotate(-6deg)}
.side .tag small{display:block;margin-top:14px;letter-spacing:.32em;font-size:10px;opacity:.8}

/* main */
.main{padding:18px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:12px 0;outline:none}
.search:focus-within{border-color:var(--violet)}
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.bell svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8}
.bell em{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:10px;flex:none}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;font-weight:700;display:grid;place-items:center}
.me b{display:block;font-size:13px}.me small{color:var(--muted);font-size:12px}
.demo{background:color-mix(in srgb,var(--amber) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 50%,var(--line));color:var(--fg);padding:8px 12px;border-radius:10px;font-size:12.5px;margin-bottom:14px}

/* banner */
.banner{position:relative;overflow:hidden;border-radius:22px;padding:30px 32px;background:linear-gradient(110deg,var(--banner-a),var(--banner-b));box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:center}
.banner .hi{font-family:var(--f-script);font-size:34px;line-height:1;color:var(--maroon)}
:root[data-theme="dark"] .banner .hi{color:#f6d57a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner .hi{color:#f6d57a}}
.banner h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,56px);line-height:.92;letter-spacing:-1px;margin:4px 0 6px;color:var(--maroon)}
:root[data-theme="dark"] .banner h1{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner h1{color:#fff}}
.banner h2{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2.4vw,26px);color:#b07d00;letter-spacing:.5px}
:root[data-theme="dark"] .banner h2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner h2{color:var(--gold)}}
.banner p{max-width:46ch;margin:10px 0 14px;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;letter-spacing:.04em}
.chips span i{width:8px;height:8px;border-radius:50%;display:block}
.deco{position:relative;height:190px}
.deco .tile{position:absolute;width:92px;height:92px;border-radius:26px;display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.deco .tile svg{width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.deco blockquote{position:absolute;right:0;top:0;margin:0;text-align:right;font-family:var(--f-script);font-size:23px;line-height:1.05;color:var(--maroon)}
:root[data-theme="dark"] .deco blockquote{color:#f6d57a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .deco blockquote{color:#f6d57a}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:16px 0}
.stat{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 18%,var(--line))}
.stat .ic{width:46px;height:46px;border-radius:14px;background:var(--c);display:grid;place-items:center;flex:none}
.stat .ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat b{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--ci);font-variant-numeric:tabular-nums}
.stat span{display:block;font-weight:600;font-size:12.5px;margin-top:3px}
.stat small{display:block;color:var(--muted);font-size:11.5px}

/* panels */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-family:var(--f-display);font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h3 i{width:26px;height:26px;border-radius:8px;background:color-mix(in srgb,var(--violet) 14%,var(--surface));display:grid;place-items:center}
.card h3 i svg{width:15px;height:15px;stroke:var(--violet);fill:none;stroke-width:2}
.charts{display:grid;grid-template-columns:1.25fr 1fr 1.25fr;gap:14px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:9.5px}
.chart .grid{stroke:var(--line);stroke-width:1}
.donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.donut svg{width:150px;height:150px;flex:none}
.donut .big{font-family:var(--f-display);font-size:26px;font-weight:800;fill:var(--fg)}
.donut .sub{font-size:10.5px;fill:var(--muted)}
.legend{display:grid;gap:8px;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{font-variant-numeric:tabular-nums}

.work{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr);gap:14px;margin-top:14px;align-items:start}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sechead h2{font-family:var(--f-display);font-size:20px}
.link{border:0;background:none;color:var(--violet-ink);font-weight:600;font-size:13px;padding:4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;min-width:0;text-align:left}
.pcard[aria-pressed="true"]{border-color:var(--violet);box-shadow:0 0 0 2px color-mix(in srgb,var(--violet) 35%,transparent),var(--shadow)}
.thumb{position:relative;height:112px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:rgba(255,255,255,.92)}
.thumb svg{width:56px;height:56px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.thumb.big{height:140px}
.dbadge{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--fg);border-radius:10px;padding:3px 8px;text-align:center;line-height:1.1;font-size:10px;color:var(--muted)}
.dbadge b{display:block;font-family:var(--f-display);font-size:17px;color:var(--fg)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ci)}
.thumb .pill{position:absolute;right:8px;top:8px}
.st-berlangsung{--c:var(--blue);--ci:var(--blue-ink)}
.st-akan{--c:var(--amber);--ci:var(--amber-ink)}
.st-perancangan{--c:var(--violet);--ci:var(--violet-ink)}
.st-selesai{--c:var(--green);--ci:var(--green-ink)}
.pbody{padding:11px 12px 12px;display:grid;gap:3px;min-width:0}
.pbody h4{font-size:14px;font-weight:700;padding-right:22px}
.meta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kebab{position:absolute;right:6px;bottom:8px;border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.kebab:hover{background:var(--surface-2)}
.kebab svg{width:16px;height:16px;fill:var(--muted)}

.detail{padding:0;overflow:hidden}
.detail .thumb{height:150px}
.detail .dbody{padding:16px;display:grid;gap:12px}
.detail h2{font-family:var(--f-display);font-size:24px;line-height:1.1}
.detail .sub{color:var(--muted);font-size:13px;margin-top:-6px}
.rows{display:grid;gap:10px}
.rows div{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:13px}
.rows svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.rows small{display:block;color:var(--muted)}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* pages */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-family:var(--f-display);font-size:28px;line-height:1.1}
.pagehead p{color:var(--muted);margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:12.5px}
.fchip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
select.inline{width:auto}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink));border-radius:5px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--fg);font-size:18px;margin-bottom:6px;justify-content:center}
.empty .btns{justify-content:center;margin-top:14px}
.yeargrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.yeargrid label{display:grid;gap:5px;font-weight:600;font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px}

/* calendar */
.calnav{display:flex;align-items:center;gap:8px}
.calnav h2{font-family:var(--f-display);font-size:20px;min-width:9ch;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal .dow{background:var(--surface-2);text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:8px 0;letter-spacing:.06em;text-transform:uppercase}
.cal .day{background:var(--surface);min-height:92px;padding:5px;display:grid;align-content:start;gap:3px;min-width:0}
.cal .day.out{background:var(--surface-2);opacity:.6}
.cal .day.today .dn{background:var(--btn);color:#fff}
.cal .dn{font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cal .ev{display:block;width:100%;border:0;text-align:left;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--ci);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checks{display:grid;gap:8px}
.chk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;width:100%}
.chk i{width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.chk[aria-pressed="true"] i{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"] i::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk[aria-pressed="true"] span{color:var(--muted);text-decoration:line-through}
.docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

/* modal + toast */
.ovl{position:fixed;inset:0;background:rgba(20,10,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:20px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto 0}
.modal.narrow{width:min(460px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-family:var(--f-display);font-size:20px}
.mx{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.mb{padding:18px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mb .full{grid-column:1/-1}
.mb label{display:grid;gap:5px;font-weight:600;font-size:12px;color:var(--muted)}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{margin-right:auto}
.modal .detail{box-shadow:none;border:0;border-radius:0 0 20px 20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:1180px){
  .charts{grid-template-columns:1fr 1fr}.charts .card:first-child{grid-column:1/-1}
  .work{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));overflow-x:auto}
  .brand{flex-direction:row;padding:0;flex:none}.brand span{display:none}.brand b{font-size:15px}
  .brand img{width:34px;height:auto}
  .nav{flex-direction:row;flex:none}.nav button{padding:9px 12px;white-space:nowrap}
  .side .tag{display:none}
  .banner{grid-template-columns:1fr;padding:22px}.deco{display:none}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.docgrid{grid-template-columns:1fr}
}
@media (max-width:600px){
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .me div{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:last-child{grid-column:1/-1}
  .charts{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}
  .yeargrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mb{grid-template-columns:1fr}
  .cal .day{min-height:58px;padding:3px}.cal .ev{font-size:0;padding:0;height:6px;border-radius:3px;background:var(--c)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- lampiran: gambar dan PDF ---------- */
.thumb{overflow:hidden}
.thumb img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.thumb.hasimg img.cover{display:block}
.thumb.hasimg>svg{display:none}
.dbody>*{min-width:0}
.att{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-top:1px solid var(--line);padding-top:12px;min-width:0}
.atthead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.atthead b{font-family:var(--f-display);font-size:14px}
.atthead span{color:var(--muted);font-size:12px}
.att .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.att select.upsel{width:auto;max-width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 10px;font-size:13px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.gi{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.gi img{width:100%;height:100%;object-fit:cover;display:none}
.gi.hasimg img{display:block}
.gi .vw{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:zoom-in}
.gi .x{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:15px;line-height:1;z-index:1}
.pdfs{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.pdfrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface)}
.pdfrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.pdfrow small{color:var(--muted);font-size:11px;white-space:nowrap}
.pdfrow button{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600}
.pdfrow button.rm{color:var(--danger)}
.attline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.lb{position:fixed;inset:0;background:rgba(10,6,20,.9);z-index:55;display:grid;place-items:center;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.lb p{color:#fff;font-weight:600}
.lb .lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px}

/* ---------- Fasa 2: Papan Utama dan Kalendar ---------- */
.focus{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin:0 0 16px}
.focus .muted,.gal-empty{color:var(--muted);font-size:13px}
.next .nx{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.next .cd{min-width:96px;text-align:center;border-radius:16px;padding:14px 8px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;flex:none}
.next .cd b{display:block;font-family:var(--f-display);font-size:36px;line-height:1}
.next .cd span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.next .nxi{min-width:0}
.next .nxi h4{font-family:var(--f-display);font-size:18px;line-height:1.2;margin-bottom:4px}
.next .nxi .meta{color:var(--muted);font-size:12.5px;line-height:1.5}
.alerts h3 .cnt{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:2px 8px}
.als{display:grid;gap:0}
.al{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.al:first-child{border-top:0}
.al i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--violet)}
.al.urgent i{background:var(--danger)}
.al.warn i{background:var(--amber)}
.al>div{min-width:0;flex:1}
.al b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al small{display:block;color:var(--muted);font-size:12px}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.okmsg{display:flex;gap:10px;align-items:center;color:var(--green-ink,var(--green));font-weight:600;font-size:13.5px}
.okmsg svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gtile{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0;cursor:zoom-in}
.gtile img{width:100%;height:100%;object-fit:cover;display:none}
.gtile.hasimg img{display:block}
.gtile span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.68));text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.calbar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;margin:-4px 0 14px}
.calleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);font-weight:600}
.calleg span{display:inline-flex;align-items:center;gap:6px}
.calleg i{width:10px;height:10px;border-radius:3px;display:block}
.calleg i.hol{background:color-mix(in srgb,var(--amber) 45%,var(--surface));border:1px solid var(--amber)}
.caltools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cal .day{position:relative}
.cal .day[data-act]{cursor:pointer}
.cal .day[data-act]:hover{background:var(--surface-2)}
.cal .day.cuti{background:color-mix(in srgb,var(--amber) 13%,var(--surface))}
.cal .holn{font-size:10px;font-weight:700;color:var(--amber-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev{border-left:3px solid var(--c)}
.cal .ev.done{opacity:.55}
.cal .addd{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;border:0;background:var(--btn);color:#fff;opacity:0;font-size:15px;line-height:1;padding:0}
.cal .day:hover .addd,.cal .addd:focus-visible{opacity:1}
.agenda{display:grid;gap:10px}
.agrow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:start}
.agrow.today{border-color:var(--violet);box-shadow:0 0 0 2px color-mix(in srgb,var(--violet) 25%,transparent)}
.agd{text-align:center;border-radius:10px;background:var(--surface-2);padding:6px 0}
.agd b{display:block;font-family:var(--f-display);font-size:22px;line-height:1}
.agd span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.agi{display:grid;gap:6px;min-width:0}
.agp{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;background:var(--surface);color:var(--fg);padding:8px 10px}
.agn{display:grid;min-width:0}
.agn b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agn small{color:var(--muted);font-size:12px}
.agh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--amber-ink);background:color-mix(in srgb,var(--amber) 14%,var(--surface));border-radius:8px;padding:6px 10px}
.agh i{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.cutirow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cutirow:first-child{border-top:0}
.cutirow small{display:block;color:var(--muted);font-size:12px}
.cutiform{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.cutiform label{display:grid;gap:5px;font-weight:600;font-size:12px;color:var(--muted)}
@media (max-width:900px){.focus{grid-template-columns:1fr}}
@media (max-width:600px){.next .nx{flex-direction:column;align-items:stretch}.next .cd{min-width:0}.cutiform{grid-template-columns:1fr}.agrow{grid-template-columns:48px minmax(0,1fr);gap:10px}}

/* ---------- Fasa 2b: tahun, cuti terbina, status automatik ---------- */
.yrsel{width:auto;max-width:132px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px;box-shadow:var(--shadow);flex:none}
.note.sugg{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--amber) 14%,var(--surface));color:var(--fg)}
.cutirow.ro b{font-weight:600}
.cutisum{font-weight:700;cursor:pointer}
</style>
</head>

var IMGC={},IMGQ=[],IMGBUSY=0,MAXPDF=6*1024*1024,PDFL=['OPR','Laporan','Kertas Kerja','Lain-lain'];
function failOf(p){return p&&Array.isArray(p.fail)?p.fail:[]}
function firstImg(p){return failOf(p).filter(function(f){return f.jenis==='gambar'&&(f.tid||f.fid)})[0]||null}
function sizeTxt(n){n=+n||0;return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}

function getFile(id){
  if(!hasApi())return Promise.reject(new Error('mod contoh'));
  return fetch(API_URL+'?action=file&id='+encodeURIComponent(id)+'&kod='+encodeURIComponent(kod())).then(function(r){return r.json()}).then(chk);
}
function paint(id){
  var u=IMGC[id];if(!u)return;
  document.querySelectorAll('img[data-img]').forEach(function(im){
    if(im.getAttribute('data-img')!==id)return;
    if(im.getAttribute('src')!==u)im.src=u;
    var h=im.closest('.thumb,.gi,.gtile');if(h)h.classList.add('hasimg');
  });
}
function pump(){
  while(IMGBUSY<3&&IMGQ.length){
    (function(id){
      IMGBUSY++;
      getFile(id).then(function(r){IMGC[id]='data:'+r.mime+';base64,'+r.data}).catch(function(){delete IMGC[id]}).then(function(){IMGBUSY--;paint(id);pump()});
    })(IMGQ.shift());
  }
}
function hydrate(){
  document.querySelectorAll('img[data-img]').forEach(function(im){
    var id=im.getAttribute('data-img');
    if(IMGC[id])paint(id);
    else if(IMGQ.indexOf(id)<0)IMGQ.push(id);
  });
  pump();
}

  if(imgs.length)h+='<div class="gal">'+imgs.map(function(f){
    return '<div class="gi"><img alt="'+esc(f.nama)+'" data-img="'+esc(f.tid||f.fid)+'"><button class="vw" data-act="viewimg" data-id="'+esc(p.id)+'" data-eid="'+esc(f.id)+'" aria-label="Lihat gambar '+esc(f.nama)+'"></button>'+

function refreshDetail(id){if(S.mdetail===id&&!$('#ovl').hidden)showDetail(id)}
function shrink(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,max/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k)),c=document.createElement('canvas');
      c.width=cw;c.height=ch;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(im,0,0,cw,ch);
      URL.revokeObjectURL(url);
      var d=c.toDataURL('image/jpeg',q);res(d.slice(d.indexOf(',')+1));
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('gambar'))};
    im.src=url;
  });
}
function readB64(file){
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var s=String(r.result);res(s.slice(s.indexOf(',')+1))};r.onerror=function(){rej(new Error('baca'))};r.readAsDataURL(file)});
}
function uploadFiles(files,jenis){
  var id=S.upId,list=Array.prototype.slice.call(files),n=list.length,i=0,okc=0,label=S.upLabel||'Lain-lain';
  if(!byId(id)||!n)return;
  if(!hasApi()){toast('Sambung ke Google Sheets dahulu');return}
  if(S.upBusy){toast('Sila tunggu muat naik sebelumnya selesai');return}
  S.upBusy=true;
  function done(){S.upBusy=false;toast(okc?okc+' fail berjaya dimuat naik':'Tiada fail dimuat naik')}
  function next(){
    if(i>=n){done();return}
    var f=list[i++],tag=f.name;
    toast('Memuat naik '+i+' / '+n+'…',true);
    var job;
    if(jenis==='gambar'){
      if(!/^image\//.test(f.type)&&!/\.(jpe?g|png|webp|gif|heic)$/i.test(f.name)){toast('Bukan fail gambar: '+tag);return setTimeout(next,1200)}
      job=Promise.all([shrink(f,1600,.8),shrink(f,480,.72)]).then(function(r){
        if(r[0].length*0.75>2.9*1024*1024)throw new Error('gambar terlalu besar');
        return {action:'upload',programId:id,jenis:'gambar',nama:f.name.replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',data:r[0],thumb:r[1]};
      });
    }else{
      if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){toast('Bukan fail PDF: '+tag);return setTimeout(next,1200)}
      if(f.size>MAXPDF){toast('PDF terlalu besar (maksimum 6 MB): '+tag);return setTimeout(next,1800)}
      job=readB64(f).then(function(b){return {action:'upload',programId:id,jenis:'pdf',label:label,nama:f.name,mime:'application/pdf',data:b}});
    }
    job.then(function(body){return api(body)}).then(chk).then(function(r){
      var q=byId(id);if(q)q.fail=r.fail;okc++;render();refreshDetail(id);
    }).catch(function(e){
      toast('Gagal memuat naik '+tag+(e&&e.message&&e.message!=='ralat'?' ('+e.message+')':''));
      return new Promise(function(ok){setTimeout(ok,1800)});
    }).then(next);
  }
  next();
}

function bars(vals,labels,o){
  o=o||{};var w=360,h=o.h||170,L=26,R=6,T=16,B=22,iw=w-L-R,ih=h-T-B,n=vals.length;
  var mx=Math.max(8,Math.ceil(Math.max.apply(null,vals.concat([0]))/(o.step||4))*(o.step||4)),out='';
  if(o.mxfix)mx=Math.max(o.mxfix,mx);
  var step=mx/4;
  for(var i=0;i<=4;i++){var y=T+ih-ih*i/4;out+='<line class="grid" x1="'+L+'" x2="'+(w-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(step*i)+'</text>'}
  var bw=iw/n*.58;
  vals.forEach(function(v,i){
    var x=L+iw/n*i+(iw/n-bw)/2,bh=ih*v/mx,y=T+ih-bh;
    out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,0).toFixed(1)+'" rx="4" fill="'+(o.colors?o.colors[i%o.colors.length]:'var(--violet)')+'" opacity="'+(o.colors?1:.75)+'"/>';
    if(o.vals&&v>0)out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" style="fill:var(--fg);font-weight:700">'+v+'</text>';
    out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-7)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.label||'Carta')+'">'+out+'</svg>';
}
function donut(parts,total){
  var r=42,C=2*Math.PI*r,off=0,out='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="15"/>';
  if(total)parts.forEach(function(p){var len=C*p.v/total;if(!p.v)return;out+='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="15" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';off+=len});
  out+='<text class="big" x="60" y="64" text-anchor="middle">'+total+'</text><text class="sub" x="60" y="78" text-anchor="middle">Program</text>';
  return '<svg viewBox="0 0 120 120" role="img" aria-label="Status program">'+out+'</svg>';
}

/* ---------- Fasa 2: tarikh, amaran, kalendar ---------- */
function todayISO(){var n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())}
function isoOf(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())}
function daysTo(iso){var a=pd(iso),b=pd(todayISO());return Math.round((Date.UTC(a.y,a.m-1,a.d)-Date.UTC(b.y,b.m-1,b.d))/864e5)}
function endOf(p){return p.tarikhTamat&&p.tarikhTamat>=p.tarikh?p.tarikhTamat:p.tarikh}
function overlap(a1,a2,b1,b2){return a1<=b2&&b1<=a2}
function rangeISO(a,b){return range({tarikh:a,tarikhTamat:b||''})}
function ucolor(p){return (UNITSTYLE[p.unit]||{a:'#6a4ce0'}).a}
function cEnd(c){return c.tamat&&c.tamat>=c.mula?c.tamat:c.mula}
function cutiUser(){
  var c=S.config.cuti;
  if(typeof c==='string'){try{c=JSON.parse(c)}catch(e){c=[]}}
  return Array.isArray(c)?c.filter(function(x){return x&&x.mula&&x.nama}):[];
}
function cutiList(){return cutiUser().concat(cutiBina())}
function cutiOn(iso){return cutiList().filter(function(c){return iso>=c.mula&&iso<=cEnd(c)})}
function clashes(p){
  var out=[];
  if(!p.tarikh)return out;
  var e=endOf(p),low=function(x){return String(x||'').trim().toLowerCase()};
  cutiList().forEach(function(c){if(overlap(p.tarikh,e,c.mula,cEnd(c)))out.push({t:'cuti',nama:c.nama,tarikh:rangeISO(c.mula,c.tamat)})});
  S.programs.forEach(function(q){
    if(q.id===p.id||!q.tarikh||!overlap(p.tarikh,e,q.tarikh,endOf(q)))return;
    var sp=low(p.pic)&&low(p.pic)===low(q.pic),st=low(p.tempat)&&low(p.tempat)===low(q.tempat);
    if(!sp&&!st)return;
    if(p.tarikh===e&&q.tarikh===endOf(q)&&p.tarikh===q.tarikh&&p.masaMula&&p.masaTamat&&q.masaMula&&q.masaTamat&&(p.masaTamat<=q.masaMula||q.masaTamat<=p.masaMula))return;
    out.push({t:'program',nama:q.nama,sebab:sp&&st?'PIC dan tempat sama':sp?'PIC sama':'tempat sama'});
  });
  return out;
}
function whenTxt(dl){return dl<=0?'Sedang berjalan':dl===1?'Esok':dl+' hari lagi'}
function alerts(){
  var out=[];
  S.programs.forEach(function(p){
    if(!p.tarikh)return;
    var e=endOf(p),dl=daysTo(p.tarikh),de=daysTo(e),d=p.dok||{};
    if(p.status!=='selesai'&&de>=0){
      if(dl>0&&dl<=14){
        var need=DOCS.filter(function(x){return (x[0]==='kk'||x[0]==='kb'||x[0]==='hd')&&!d[x[0]]});
        if(need.length)out.push({p:p,sev:dl,cls:dl<=3?'urgent':'warn',msg:'Dokumen belum lengkap: '+need.slice(0,2).map(function(x){return x[1].toLowerCase()}).join(', ')+(need.length>2?' +'+(need.length-2):''),when:whenTxt(dl)});
      }
      if(dl<=0&&(p.status==='akan'||p.status==='perancangan'))out.push({p:p,sev:dl-.5,cls:'warn',msg:'Sedang berjalan ikut tarikh, status masih "'+ST[p.status]+'"',when:'Hari ini',fix:'berlangsung'});
      if(!p.pic&&dl<=30)out.push({p:p,sev:dl+.5,cls:'warn',msg:'Belum ada PIC',when:whenTxt(dl)});
      if(dl<=60){var cl=clashes(p);if(cl.length)out.push({p:p,sev:dl-.2,cls:'urgent',msg:'Bertindih: '+cl.slice(0,2).map(function(c){return c.t==='cuti'?c.nama:c.nama+' ('+c.sebab+')'}).join('; '),when:whenTxt(dl)})}
    }else{
      var ago=-de;
      if(ago<0||ago>45)return;
      if(p.status!=='selesai')out.push({p:p,sev:20+ago,cls:'warn',msg:'Tarikh sudah lepas, status belum ditandakan selesai',when:ago===0?'Tamat hari ini':ago+' hari lalu',fix:'selesai'});
      else if(!d.lp&&!failOf(p).some(function(f){return f.jenis==='pdf'}))out.push({p:p,sev:40+ago,cls:'info',msg:'Laporan belum dimuat naik atau ditanda siap',when:ago===0?'Tamat hari ini':ago+' hari lalu'});
    }
  });
  return out.sort(function(a,b){return a.sev-b.sev});
}

function icsEsc(t){return String(t==null?'':t).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsFold(l){
  var enc=new TextEncoder(),out=[],cur='',n=0;
  Array.from(l).forEach(function(ch){var b=enc.encode(ch).length;if(n+b>(out.length?74:75)){out.push(cur);cur='';n=0}cur+=ch;n+=b});
  out.push(cur);return out.join('\r\n ');
}
function icsDT(iso,t){return iso.replace(/-/g,'')+(t?'T'+t.replace(':','')+'00':'')}

function exportIcs(){
  var P=yearProgs().filter(function(p){return p.tarikh});
  if(!P.length){toast('Tiada program untuk dieksport');return}
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kokum SmartTrax//SKGG//MS','CALSCALE:GREGORIAN','X-WR-CALNAME:Kokum SmartTrax '+curYear()];
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  P.forEach(function(p){
    var e=endOf(p),timed=p.masaMula&&p.masaTamat&&(e>p.tarikh||p.masaTamat>p.masaMula);
    L.push('BEGIN:VEVENT','UID:'+p.id+'@kokum-smarttrax','DTSTAMP:'+stamp);
    if(timed)L.push('DTSTART:'+icsDT(p.tarikh,p.masaMula),'DTEND:'+icsDT(e,p.masaTamat));
    else{var q=pd(e),nx=new Date(q.y,q.m-1,q.d+1);L.push('DTSTART;VALUE=DATE:'+icsDT(p.tarikh),'DTEND;VALUE=DATE:'+icsDT(isoOf(nx)))}
    L.push('SUMMARY:'+icsEsc(p.nama));
    if(p.tempat)L.push('LOCATION:'+icsEsc(p.tempat));
    var desc=[p.unit,p.pic?'PIC: '+p.pic:'',p.catatan].filter(Boolean).join('\n');
    if(desc)L.push('DESCRIPTION:'+icsEsc(desc));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  var bl=new Blob([L.map(icsFold).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}),an=document.createElement('a');
  an.href=URL.createObjectURL(bl);an.download='kokum-smarttrax-'+curYear()+'.ics';document.body.appendChild(an);an.click();
  setTimeout(function(){URL.revokeObjectURL(an.href);an.remove()},1000);
  toast(P.length+' program dieksport');
}

  else if(f.t==='textarea')ctl='<textarea id="'+id+'" name="'+f.k+'" rows="3">'+esc(val)+'</textarea>';
  else ctl='<input id="'+id+'" name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(val)+'"'+(f.req?' required':'')+(f.t==='number'?' min="0"':'')+(f.list?' list="'+f.list+'"':'')+'>';
  return '<label'+cls+' for="'+id+'">'+esc(f.l)+(f.req?' *':'')+ctl+'</label>';
}
function openModal(html,narrow){$('#modal').className='modal'+(narrow?' narrow':'');$('#modal').innerHTML=html;$('#ovl').hidden=false;hydrate()}
function closeModal(){$('#ovl').hidden=true;$('#modal').innerHTML='';S.form=null;S.lock=false;S.mdetail=null}
function openForm(o){
  S.form=o;
  openModal('<form id="frm"><div class="mh"><h2>'+esc(o.title)+'</h2><button type="button" class="mx" data-act="close" aria-label="Tutup">×</button></div><div class="mb">'+o.fields.map(function(f){return fld(f,o.values[f.k])}).join('')+(o.extra||'')+'</div><div class="mf">'+(o.onDelete?'<button type="button" class="btn warn sp" data-act="formdel">Padam</button>':'')+'<button type="button" class="btn" data-act="close">Batal</button><button class="btn pri" type="submit">Simpan</button></div></form>',o.narrow);
  var first=$('#frm input,#frm select');if(first)first.focus();
}
function guruNames(){return S.guru.map(function(g){return g.nama})}
function progForm(p){
  p=p||{status:'perancangan',unit:UNITS[0],murid:0,guru:0,tarikh:'',tarikhTamat:'',masaMula:'08:00',masaTamat:'12:00'};
  var isNew=!p.id;
  openForm({title:isNew?'Program baharu':'Sunting program',values:p,
   fields:[{k:'nama',l:'Nama program',req:1,full:1},{k:'unit',l:'Unit',t:'select',o:UNITS.map(function(u){return [u,u]})},{k:'status',l:'Status',t:'select',o:Object.keys(ST).map(function(k){return [k,ST[k]]})},
    {k:'tarikh',l:'Tarikh mula',t:'date',req:1},{k:'tarikhTamat',l:'Tarikh tamat (jika lebih sehari)',t:'date'},{k:'masaMula',l:'Masa mula',t:'time'},{k:'masaTamat',l:'Masa tamat',t:'time'},
    {k:'tempat',l:'Tempat',full:1},{k:'pic',l:'PIC program',list:'gurulist'},{k:'murid',l:'Bilangan murid',t:'number'},{k:'guru',l:'Bilangan guru',t:'number'},{k:'catatan',l:'Catatan',t:'textarea',full:1}],
   extra:'<datalist id="gurulist">'+guruNames().map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist>',
   onDelete:isNew?null:function(){del('programs',p.id).then(function(){closeModal();fixSel();toast('Program dipadam')})},
   onSave:function(v){
     if(v.tarikhTamat&&v.tarikhTamat<v.tarikh){toast('Tarikh tamat mesti selepas tarikh mula');return}
     var cl=clashes(Object.assign({},v,{id:p.id||''}));
     if(cl.length&&!window.confirm('Perhatian:\n'+cl.slice(0,4).map(function(c){return '• '+(c.t==='cuti'?'Bertindih dengan '+c.nama+' ('+c.tarikh+')':'Bertindih dengan program "'+c.nama+'" ('+c.sebab+')')}).join('\n')+'\n\nTeruskan menyimpan?'))return;
     var data=Object.assign({},p.id?strip(p):{dok:{}},v,{murid:+v.murid||0,guru:+v.guru||0});
     var id=p.id||newId('p');
     put('programs',id,data).then(function(){S.sel=id;closeModal();toast('Program disimpan')});
   }});
}
function guruForm(g){
  g=g||{};var isNew=!g.id;
  openForm({title:isNew?'Tambah warga kokum':'Sunting warga kokum',values:g,narrow:1,
   fields:[{k:'nama',l:'Nama',req:1,full:1},{k:'jawatan',l:'Jawatan',full:1},{k:'unit',l:'Unit',full:1,t:'select',o:[['','Semua unit']].concat(UNITS.map(function(u){return [u,u]}))}],
   onDelete:isNew?null:function(){del('guru',g.id).then(function(){closeModal();toast('Dipadam')})},
   onSave:function(v){put('guru',g.id||newId('g'),v).then(function(){closeModal();toast('Disimpan')})}});
}
function showDetail(id){var p=byId(id);if(!p)return;S.mdetail=id;openModal('<div class="mh"><h2>Maklumat program</h2><button type="button" class="mx" data-act="close" aria-label="Tutup">×</button></div>'+detail(p));}

function csv(){
  var P=yearProgs(),rows=[['Program','Unit','Tarikh mula','Tarikh tamat','Tempat','PIC','Murid','Guru','Status']].concat(sorted(P).map(function(p){return [p.nama,p.unit,p.tarikh,p.tarikhTamat||'',p.tempat,p.pic,p.murid,p.guru,ST[p.status]]}));
  var s='﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return '"'+c.replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  var bl=new Blob([s],{type:'text/csv;charset=utf-8'}),an=document.createElement('a');an.href=URL.createObjectURL(bl);an.download='program-kokurikulum-'+curYear()+'.csv';document.body.appendChild(an);an.click();setTimeout(function(){URL.revokeObjectURL(an.href);an.remove()},500);toast('Fail dimuat turun');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){if(e.target.id==='ovl'&&!S.lock)closeModal();return}
  var a=t.dataset.act,id=t.dataset.id,p=id&&byId(id);
  if(a==='nav'){S.page=t.dataset.p;render();window.scrollTo(0,0)}
  else if(a==='open'){S.sel=id;if(S.page==='utama')render();else showDetail(id)}
  else if(a==='edit'){e.stopPropagation();closeModal();progForm(p)}
  else if(a==='newprog')progForm();
  else if(a==='newguru')guruForm();
  else if(a==='editguru')guruForm(S.guru.filter(function(g){return g.id===id})[0]);
  else if(a==='seed')seed();
  else if(a==='close')closeModal();
  else if(a==='formdel'){if(S.form&&S.form.onDelete)S.form.onDelete()}
  else if(a==='filter'){S.filter=t.dataset.v;render()}
  else if(a==='toggledone'&&p){put('programs',id,Object.assign(strip(p),{status:p.status==='selesai'?'berlangsung':'selesai'})).then(function(){closeModal();toast(p.status==='selesai'?'Program dibuka semula':'Program ditandakan selesai')})}
  else if(a==='docs'){closeModal();S.page='dokumen';render();var el=document.getElementById('doc-'+id);if(el)el.scrollIntoView({block:'center'})}
  else if(a==='doc'&&p){var d=Object.assign({},p.dok||{});d[t.dataset.k]=!d[t.dataset.k];put('programs',id,Object.assign(strip(p),{dok:d}))}
  else if(a==='calprev'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()-1,1);render()}
  else if(a==='calnext'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+1,1);render()}
  else if(a==='caltoday'){var n=new Date();S.cal=new Date(n.getFullYear(),n.getMonth(),1);render()}
  else if(a==='reload')load();
  else if(a==='kod')askKod(true);
  else if(a==='csv')csv();
  else if(a==='addimg'){S.upId=id;var ii=$('#upImg');ii.value='';ii.click()}
  else if(a==='addpdf'){S.upId=id;S.upLabel=S.pdfJenis||($('#pdfJenis')||{}).value||'OPR';var pi=$('#upPdf');pi.value='';pi.click()}
  else if(a==='viewimg'&&p)viewImg(p,t.dataset.eid);
  else if(a==='openpdf'&&p)openPdf(p,t.dataset.eid);
  else if(a==='delfile'&&p)delFile(p,t.dataset.eid);
  else if(a==='showdet'&&p)showDetail(id);
  else if(a==='setstatus'&&p){put('programs',id,Object.assign(strip(p),{status:t.dataset.v})).then(function(){toast('Status dikemas kini');refreshDetail(id)})}
  else if(a==='calview'){S.calView=t.dataset.v;render()}
  else if(a==='newday'){progForm({status:'perancangan',unit:UNITS[0],murid:0,guru:0,tarikh:t.dataset.d,tarikhTamat:'',masaMula:'08:00',masaTamat:'12:00'})}
  else if(a==='ics')exportIcs();
  else if(a==='backup')backup();
  else if(a==='cutimgr')cutiModal();
  else if(a==='delcuti'){saveCuti(cutiUser().filter(function(c){return c.id!==id})).then(function(){cutiModal();toast('Dipadam')})}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#ovl').hidden&&!S.lock)closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pcard')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='unitSel'){S.unit=e.target.value;render()}
  else if(e.target.id==='pdfJenis'){S.pdfJenis=e.target.value}
  else if(e.target.id==='yearSel'){var yv=+e.target.value,nw=new Date();S.year=yv;try{localStorage.setItem('kokum.tahun',String(yv))}catch(x){}S.cal=new Date(yv,yv===nw.getFullYear()?nw.getMonth():0,1);render()}
  else if(e.target.id==='upImg'){if(e.target.files&&e.target.files.length)uploadFiles(e.target.files,'gambar')}
  else if(e.target.id==='upPdf'){if(e.target.files&&e.target.files.length)uploadFiles(e.target.files,'pdf')}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,v={};
  if(f.id==='frm'){new FormData(f).forEach(function(x,k){v[k]=typeof x==='string'?x.trim():x});if(S.form)S.form.onSave(v)}
  else if(f.id==='kodForm'){var kv=f.elements.kod.value.trim();try{localStorage.setItem(KEY,kv)}catch(x){}closeModal();load()}
  else if(f.id==='cutiForm'){
    new FormData(f).forEach(function(x,k){v[k]=typeof x==='string'?x.trim():x});
    if(v.tamat&&v.tamat<v.mula){toast('Tarikh tamat mesti selepas tarikh mula');return}
    saveCuti(cutiUser().concat([{id:newId('c'),nama:v.nama,mula:v.mula,tamat:v.tamat||''}])).then(function(){cutiModal();toast('Ditambah')})}
  else if(f.id==='yearForm'){var arr=[0,1,2,3,4,5].map(function(i){return +f.elements['y'+i].value||0});put('config','main',Object.assign({},S.config,{penyertaan:arr})).then(function(){toast('Penyertaan disimpan')})}
  else if(f.id==='cfgForm'){new FormData(f).forEach(function(x,k){v[k]=typeof x==='string'?x.trim():x});v.tahun=+v.tahun||S.config.tahun;put('config','main',Object.assign({},S.config,v)).then(function(){toast('Tetapan disimpan')})}
});
$('#q').addEventListener('input',function(e){S.q=e.target.value;if(S.page!=='program'){S.page='program';render()}else{render()}});
$('#bell').addEventListener('click',function(){S.page='kalendar';var n=new Date();S.cal=new Date(n.getFullYear(),n.getMonth(),1);render()});

try{var ys0=+localStorage.getItem('kokum.tahun');if(ys0>=2000&&ys0<=2100){S.year=ys0;if(ys0!==new Date().getFullYear())S.cal=new Date(ys0,0,1)}}catch(e){}
S.sel=sorted(S.programs)[0].id;
$('#demo').hidden=false;
chrome();render();boot();
})();
</script>
</body>
</html>
