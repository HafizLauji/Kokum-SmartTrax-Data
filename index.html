<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kokum SmartTrax</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: maroon sidebar + lavender workspace. Dashboard = banner, 5 stat tiles, 3 charts, program cards beside a detail panel. */
:root{
  --bg:#f1f1fa; --surface:#ffffff; --surface-2:#f6f5fd; --fg:#1d1633; --muted:#686384; --line:#e5e2f3;
  --maroon:#6e0f3b; --maroon-2:#4a0929; --gold:#f2c14e; --gold-ink:#3a2600;
  --violet:#6a4ce0; --blue:#2f8de4; --green:#27ad6a; --amber:#f2a01b; --pink:#ec5b9a;
  --violet-ink:#5238c4; --blue-ink:#1b64b0; --green-ink:#157a46; --amber-ink:#975900;
  --btn:#5b3fd6; --btn-ink:#ffffff; --danger:#c62f4b;
  --banner-a:#e9e4ff; --banner-b:#ffe8d6; --shadow:0 1px 2px rgba(60,30,110,.06),0 8px 24px rgba(60,30,110,.07);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-script:'Caveat','Segoe Script',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14101d; --surface:#1f1a2c; --surface-2:#271f37; --fg:#f0ecfb; --muted:#a8a2c2; --line:#352b4c;
  --violet:#9a82ff; --blue:#5aa8f0; --green:#3cc886; --amber:#f5b445; --pink:#f47fb2;
  --violet-ink:#b9a8ff; --blue-ink:#8cc4f7; --green-ink:#72dca6; --amber-ink:#f7c46a;
  --btn:#6d50ea; --banner-a:#2b2150; --banner-b:#3a2230; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14101d; --surface:#1f1a2c; --surface-2:#271f37; --fg:#f0ecfb; --muted:#a8a2c2; --line:#352b4c;
  --violet:#9a82ff; --blue:#5aa8f0; --green:#3cc886; --amber:#f5b445; --pink:#f47fb2;
  --violet-ink:#b9a8ff; --blue-ink:#8cc4f7; --green-ink:#72dca6; --amber-ink:#f7c46a;
  --btn:#6d50ea; --banner-a:#2b2150; --banner-b:#3a2230; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:linear-gradient(180deg,var(--maroon) 0%,var(--maroon-2) 100%);color:#fff;display:flex;flex-direction:column;gap:18px;
  padding:22px 14px 22px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:hidden}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:4px}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.85}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#fff;padding:11px 14px;border-radius:12px;text-align:left;font-weight:500}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,#f6d57a,#eab949);color:var(--gold-ink);font-weight:700}
.side .tag{margin-top:auto;text-align:center}
.side .tag i{display:block;font-family:var(--f-script);font-style:normal;font-size:30px;line-height:1;color:#f6d57a;transform:rotate(-6deg)}
.side .tag small{display:block;margin-top:14px;letter-spacing:.32em;font-size:10px;opacity:.8}

/* main */
.main{padding:18px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;padding:12px 0;outline:none}
.search:focus-within{border-color:var(--violet)}
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.bell svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8}
.bell em{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:10px;flex:none}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;font-weight:700;display:grid;place-items:center}
.me b{display:block;font-size:13px}.me small{color:var(--muted);font-size:12px}
.demo{background:color-mix(in srgb,var(--amber) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 50%,var(--line));color:var(--fg);padding:8px 12px;border-radius:10px;font-size:12.5px;margin-bottom:14px}

/* banner */
.banner{position:relative;overflow:hidden;border-radius:22px;padding:30px 32px;background:linear-gradient(110deg,var(--banner-a),var(--banner-b));box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:center}
.banner .hi{font-family:var(--f-script);font-size:34px;line-height:1;color:var(--maroon)}
:root[data-theme="dark"] .banner .hi{color:#f6d57a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner .hi{color:#f6d57a}}
.banner h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,56px);line-height:.92;letter-spacing:-1px;margin:4px 0 6px;color:var(--maroon)}
:root[data-theme="dark"] .banner h1{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner h1{color:#fff}}
.banner h2{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2.4vw,26px);color:#b07d00;letter-spacing:.5px}
:root[data-theme="dark"] .banner h2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner h2{color:var(--gold)}}
.banner p{max-width:46ch;margin:10px 0 14px;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;letter-spacing:.04em}
.chips span i{width:8px;height:8px;border-radius:50%;display:block}
.deco{position:relative;height:190px}
.deco .tile{position:absolute;width:92px;height:92px;border-radius:26px;display:grid;place-items:center;color:#fff;box-shadow:var(--shadow)}
.deco .tile svg{width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.deco blockquote{position:absolute;right:0;top:0;margin:0;text-align:right;font-family:var(--f-script);font-size:23px;line-height:1.05;color:var(--maroon)}
:root[data-theme="dark"] .deco blockquote{color:#f6d57a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .deco blockquote{color:#f6d57a}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:16px 0}
.stat{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--c) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 18%,var(--line))}
.stat .ic{width:46px;height:46px;border-radius:14px;background:var(--c);display:grid;place-items:center;flex:none}
.stat .ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat b{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--ci);font-variant-numeric:tabular-nums}
.stat span{display:block;font-weight:600;font-size:12.5px;margin-top:3px}
.stat small{display:block;color:var(--muted);font-size:11.5px}

/* panels */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-family:var(--f-display);font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h3 i{width:26px;height:26px;border-radius:8px;background:color-mix(in srgb,var(--violet) 14%,var(--surface));display:grid;place-items:center}
.card h3 i svg{width:15px;height:15px;stroke:var(--violet);fill:none;stroke-width:2}
.charts{display:grid;grid-template-columns:1.25fr 1fr 1.25fr;gap:14px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:9.5px}
.chart .grid{stroke:var(--line);stroke-width:1}
.donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.donut svg{width:150px;height:150px;flex:none}
.donut .big{font-family:var(--f-display);font-size:26px;font-weight:800;fill:var(--fg)}
.donut .sub{font-size:10.5px;fill:var(--muted)}
.legend{display:grid;gap:8px;font-size:12px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{font-variant-numeric:tabular-nums}

.work{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr);gap:14px;margin-top:14px;align-items:start}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sechead h2{font-family:var(--f-display);font-size:20px}
.link{border:0;background:none;color:var(--violet-ink);font-weight:600;font-size:13px;padding:4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;min-width:0;text-align:left}
.pcard[aria-pressed="true"]{border-color:var(--violet);box-shadow:0 0 0 2px color-mix(in srgb,var(--violet) 35%,transparent),var(--shadow)}
.thumb{position:relative;height:112px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:rgba(255,255,255,.92)}
.thumb svg{width:56px;height:56px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.thumb.big{height:140px}
.dbadge{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--fg);border-radius:10px;padding:3px 8px;text-align:center;line-height:1.1;font-size:10px;color:var(--muted)}
.dbadge b{display:block;font-family:var(--f-display);font-size:17px;color:var(--fg)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ci)}
.thumb .pill{position:absolute;right:8px;top:8px}
.st-berlangsung{--c:var(--blue);--ci:var(--blue-ink)}
.st-akan{--c:var(--amber);--ci:var(--amber-ink)}
.st-perancangan{--c:var(--violet);--ci:var(--violet-ink)}
.st-selesai{--c:var(--green);--ci:var(--green-ink)}
.pbody{padding:11px 12px 12px;display:grid;gap:3px;min-width:0}
.pbody h4{font-size:14px;font-weight:700;padding-right:22px}
.meta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kebab{position:absolute;right:6px;bottom:8px;border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.kebab:hover{background:var(--surface-2)}
.kebab svg{width:16px;height:16px;fill:var(--muted)}

.detail{padding:0;overflow:hidden}
.detail .thumb{height:150px}
.detail .dbody{padding:16px;display:grid;gap:12px}
.detail h2{font-family:var(--f-display);font-size:24px;line-height:1.1}
.detail .sub{color:var(--muted);font-size:13px;margin-top:-6px}
.rows{display:grid;gap:10px}
.rows div{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:13px}
.rows svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.rows small{display:block;color:var(--muted)}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* pages */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-family:var(--f-display);font-size:28px;line-height:1.1}
.pagehead p{color:var(--muted);margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:12.5px}
.fchip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
select.inline{width:auto}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink));border-radius:5px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--fg);font-size:18px;margin-bottom:6px;justify-content:center}
.empty .btns{justify-content:center;margin-top:14px}
.yeargrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.yeargrid label{display:grid;gap:5px;font-weight:600;font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px}

/* calendar */
.calnav{display:flex;align-items:center;gap:8px}
.calnav h2{font-family:var(--f-display);font-size:20px;min-width:9ch;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal .dow{background:var(--surface-2);text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:8px 0;letter-spacing:.06em;text-transform:uppercase}
.cal .day{background:var(--surface);min-height:92px;padding:5px;display:grid;align-content:start;gap:3px;min-width:0}
.cal .day.out{background:var(--surface-2);opacity:.6}
.cal .day.today .dn{background:var(--btn);color:#fff}
.cal .dn{font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cal .ev{display:block;width:100%;border:0;text-align:left;font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--ci);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checks{display:grid;gap:8px}
.chk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;width:100%}
.chk i{width:18px;height:18px;border-radius:5px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.chk[aria-pressed="true"] i{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"] i::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk[aria-pressed="true"] span{color:var(--muted);text-decoration:line-through}
.docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

/* modal + toast */
.ovl{position:fixed;inset:0;background:rgba(20,10,40,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:20px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto 0}
.modal.narrow{width:min(460px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-family:var(--f-display);font-size:20px}
.mx{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.mb{padding:18px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mb .full{grid-column:1/-1}
.mb label{display:grid;gap:5px;font-weight:600;font-size:12px;color:var(--muted)}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{margin-right:auto}
.modal .detail{box-shadow:none;border:0;border-radius:0 0 20px 20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:1180px){
  .charts{grid-template-columns:1fr 1fr}.charts .card:first-child{grid-column:1/-1}
  .work{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));overflow-x:auto}
  .brand{flex-direction:row;padding:0;flex:none}.brand span{display:none}.brand b{font-size:15px}
  .brand svg{width:34px;height:34px}
  .nav{flex-direction:row;flex:none}.nav button{padding:9px 12px;white-space:nowrap}
  .side .tag{display:none}
  .banner{grid-template-columns:1fr;padding:22px}.deco{display:none}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.docgrid{grid-template-columns:1fr}
}
@media (max-width:600px){
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .me div{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:last-child{grid-column:1/-1}
  .charts{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}
  .yeargrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mb{grid-template-columns:1fr}

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function pd(s){var a=String(s||'').split('-').map(Number);return {y:a[0],m:a[1],d:a[2]}}
function svg(p,c){return '<svg viewBox="0 0 '+(c||24)+' '+(c||24)+'" aria-hidden="true">'+p+'</svg>'}
function range(p){

}
function hhmm(t){if(!t)return '';var a=t.split(':').map(Number),h=a[0],m=a[1];var ap=h>=12?'petang':'pagi';if(h>=19)ap='malam';var h12=h%12||12;return h12+':'+pad(m)+' '+ap}
function timeRange(p){return (p.masaMula||p.masaTamat)?hhmm(p.masaMula)+(p.masaTamat?' – '+hhmm(p.masaTamat):''):'Masa belum ditetapkan'}
function sorted(list){

}
function yearProgs(){return S.programs.filter(function(p){return pd(p.tarikh).y===+S.config.tahun})}
function byId(id){return S.programs.filter(function(p){return p.id===id})[0]}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2600)}

/* ---------- storage: Google Apps Script + Google Sheets ---------- */
var API_URL='https://script.google.com/macros/s/AKfycbwOMLVV13STZ5aj4td8HubuAzvxEoMcSkpr2ki8XQuJOPzB-3CsL72k92_DOTQgiXtw/exec'; // tampal URL Web App Apps Script di sini (lihat README)
var KEY='kokum.kod';
function hasApi(){return /^https:\/\/script\.google\.com\//.test(API_URL)}
function kod(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
function api(body){
  if(!body)return fetch(API_URL+'?action=all&kod='+encodeURIComponent(kod())).then(function(r){return r.json()});
  body.kod=kod();
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function chk(r){
  if(r&&r.ok)return r;
  if(r&&r.error==='kod')askKod();
  throw new Error((r&&r.error)||'ralat');
}
function persistErr(){toast('Tidak dapat menyimpan. Semak sambungan internet atau kod akses.')}
function strip(o){var c=Object.assign({},o);delete c.id;return c}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function put(coll,id,data){
  if(coll==='config'){S.config=data}
  else{var arr=coll==='programs'?S.programs:S.guru,o=Object.assign({id:id},data),i=arr.findIndex(function(x){return x.id===id});if(i<0)arr.push(o);else arr[i]=o}
  render();
  if(!hasApi())return Promise.resolve();
  return api({action:coll==='config'?'config':'save',sheet:coll,id:id,data:data}).then(chk).catch(function(e){persistErr();load(true);throw e});
}
function del(coll,id){
  var key=coll==='programs'?'programs':'guru';
  S[key]=S[key].filter(function(x){return x.id!==id});render();
  if(!hasApi())return Promise.resolve();
  return api({action:'delete',sheet:coll,id:id}).then(chk).catch(function(e){persistErr();load(true);throw e});
}
function seed(){
  S.programs=JSON.parse(JSON.stringify(SAMPLE.programs));S.guru=JSON.parse(JSON.stringify(SAMPLE.guru));S.config=JSON.parse(JSON.stringify(SAMPLE.config));
  fixSel();render();
  if(!hasApi()){toast('Data contoh dimuatkan');return}
  api({action:'seed',programs:SAMPLE.programs,guru:SAMPLE.guru,config:SAMPLE.config}).then(chk).then(function(){toast('Data contoh dimuatkan')}).catch(function(){persistErr();load(true)});
}
function load(quiet){
  if(!hasApi())return;
  if(!quiet){S.err=null;S.loaded={p:false,g:false,c:false};render()}
  api().then(function(r){
    if(!r||!r.ok){if(r&&r.error==='kod'){askKod();return}throw new Error((r&&r.error)||'ralat')}
    S.programs=r.programs||[];S.guru=r.guru||[];S.config=Object.assign({},SAMPLE.config,r.config||{});
    S.loaded={p:true,g:true,c:true};S.err=null;fixSel();render();
  }).catch(function(e){
    if(!quiet){S.err='Tidak dapat berhubung dengan Google Sheets. Semak URL Web App dan sambungan internet.';S.loaded={p:true,g:true,c:true};render()}
  });
}
function askKod(){
  S.lock=true;

  var i=$('#kodIn');if(i)i.focus();
}
function fixSel(){if(!S.sel||!byId(S.sel)){var l=sorted(S.programs);S.sel=l.length?l[0].id:null}}

  chrome();render();

/* ---------- chrome ---------- */
function chrome(){
  var c=S.config;

  var n=S.programs.filter(function(p){return p.status!=='selesai'&&((p.tarikh>=t0&&p.tarikh<=t1)||p.status==='berlangsung')}).length;

/* ---------- visuals ---------- */
function thumb(p,big){
  var u=UNITSTYLE[p.unit]||{a:'#6a4ce0',b:'#ec5b9a',i:'star'};var a=pd(p.tarikh);
  return '<div class="thumb'+(big?' big':'')+'" style="--g1:'+u.a+';--g2:'+u.b+'">'+svg(PATHS[u.i],48)+
   (big?'':'<span class="dbadge"><b>'+(a.d<10?'0':'')+a.d+'</b>'+MON[a.m-1]+' '+a.y+'</span>')+
   '<span class="pill st-'+p.status+'">'+ST[p.status]+'</span></div>';
}
function bars(vals,labels,o){
  o=o||{};var w=360,h=o.h||170,L=26,R=6,T=16,B=22,iw=w-L-R,ih=h-T-B,n=vals.length;
  var mx=Math.max(8,Math.ceil(Math.max.apply(null,vals.concat([0]))/(o.step||4))*(o.step||4)),out='';
  if(o.mxfix)mx=Math.max(o.mxfix,mx);
  var step=mx/4;
  for(var i=0;i<=4;i++){var y=T+ih-ih*i/4;out+='<line class="grid" x1="'+L+'" x2="'+(w-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(step*i)+'</text>'}
  var bw=iw/n*.58;
  vals.forEach(function(v,i){
    var x=L+iw/n*i+(iw/n-bw)/2,bh=ih*v/mx,y=T+ih-bh;
    out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,0).toFixed(1)+'" rx="4" fill="'+(o.colors?o.colors[i%o.colors.length]:'var(--violet)')+'" opacity="'+(o.colors?1:.75)+'"/>';
    if(o.vals&&v>0)out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" style="fill:var(--fg);font-weight:700">'+v+'</text>';
    out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-7)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.label||'Carta')+'">'+out+'</svg>';
}
function donut(parts,total){
  var r=42,C=2*Math.PI*r,off=0,out='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="15"/>';
  if(total)parts.forEach(function(p){var len=C*p.v/total;if(!p.v)return;out+='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="15" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';off+=len});
  out+='<text class="big" x="60" y="64" text-anchor="middle">'+total+'</text><text class="sub" x="60" y="78" text-anchor="middle">Program</text>';
  return '<svg viewBox="0 0 120 120" role="img" aria-label="Status program">'+out+'</svg>';
}

  '<button class="kebab" data-act="edit" data-id="'+esc(p.id)+'" aria-label="Sunting '+esc(p.nama)+'"><svg viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="8" cy="13" r="1.5"/></svg></button></div>';
}
function detail(p){
  if(!p)return '<div class="card empty"><h3>Pilih satu program</h3><p>Klik mana-mana kad program untuk melihat maklumatnya di sini.</p></div>';
  var row=function(ic,t,s){return '<div>'+svg(ic)+'<span>'+t+(s?'<small>'+s+'</small>':'')+'</span></div>'};
  var done=p.status==='selesai';
  return '<div class="card detail">'+thumb(p,true)+'<div class="dbody"><h2>'+esc(p.nama)+'</h2><div class="sub">'+esc(S.config.sekolah)+' '+esc(S.config.tahun)+'</div><div class="rows">'+
   row('<path d="M4 5h16v16H4zM4 10h16M8 3v4M16 3v4"/>',esc(range(p)))+
   row('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',esc(timeRange(p)))+
   row('<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',esc(p.tempat||'Tempat belum ditetapkan'))+

function fld(f,v){

  else if(f.t==='textarea')ctl='<textarea id="'+id+'" name="'+f.k+'" rows="3">'+esc(val)+'</textarea>';
  else ctl='<input id="'+id+'" name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(val)+'"'+(f.req?' required':'')+(f.t==='number'?' min="0"':'')+(f.list?' list="'+f.list+'"':'')+'>';

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){if(e.target.id==='ovl'&&!S.lock)closeModal();return}
  var a=t.dataset.act,id=t.dataset.id,p=id&&byId(id);
  if(a==='nav'){S.page=t.dataset.p;render();window.scrollTo(0,0)}
  else if(a==='open'){S.sel=id;if(S.page==='utama')render();else showDetail(id)}
  else if(a==='edit'){e.stopPropagation();closeModal();progForm(p)}
  else if(a==='newprog')progForm();
  else if(a==='newguru')guruForm();
  else if(a==='editguru')guruForm(S.guru.filter(function(g){return g.id===id})[0]);
  else if(a==='seed')seed();
  else if(a==='close')closeModal();
  else if(a==='formdel'){if(S.form&&S.form.onDelete)S.form.onDelete()}
  else if(a==='filter'){S.filter=t.dataset.v;render()}
  else if(a==='toggledone'&&p){put('programs',id,Object.assign(strip(p),{status:p.status==='selesai'?'berlangsung':'selesai'})).then(function(){closeModal();toast(p.status==='selesai'?'Program dibuka semula':'Program ditandakan selesai')})}
  else if(a==='docs'){closeModal();S.page='dokumen';render();var el=document.getElementById('doc-'+id);if(el)el.scrollIntoView({block:'center'})}
  else if(a==='doc'&&p){var d=Object.assign({},p.dok||{});d[t.dataset.k]=!d[t.dataset.k];put('programs',id,Object.assign(strip(p),{dok:d}))}
  else if(a==='calprev'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()-1,1);render()}
  else if(a==='calnext'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+1,1);render()}
  else if(a==='caltoday'){var n=new Date();S.cal=new Date(n.getFullYear(),n.getMonth(),1);render()}
  else if(a==='reload')load();
  else if(a==='kod')askKod();
  else if(a==='csv')csv();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#ovl').hidden&&!S.lock)closeModal();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pcard')){e.preventDefault();e.target.click()}
});
document.addEventListener('change',function(e){if(e.target.id==='unitSel'){S.unit=e.target.value;render()}});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,v={};
  if(f.id==='frm'){new FormData(f).forEach(function(x,k){v[k]=typeof x==='string'?x.trim():x});if(S.form)S.form.onSave(v)}
  else if(f.id==='kodForm'){var kv=f.elements.kod.value.trim();try{localStorage.setItem(KEY,kv)}catch(x){}closeModal();load()}
  else if(f.id==='yearForm'){var arr=[0,1,2,3,4,5].map(function(i){return +f.elements['y'+i].value||0});put('config','main',Object.assign({},S.config,{penyertaan:arr})).then(function(){toast('Penyertaan disimpan')})}
  else if(f.id==='cfgForm'){new FormData(f).forEach(function(x,k){v[k]=typeof x==='string'?x.trim():x});v.tahun=+v.tahun||S.config.tahun;put('config','main',Object.assign({},S.config,v)).then(function(){toast('Tetapan disimpan')})}
});
$('#q').addEventListener('input',function(e){S.q=e.target.value;if(S.page!=='program'){S.page='program';render()}else{render()}});
$('#bell').addEventListener('click',function(){S.page='kalendar';var n=new Date();S.cal=new Date(n.getFullYear(),n.getMonth(),1);render()});

S.sel=sorted(S.programs)[0].id;
$('#demo').hidden=false;
chrome();render();boot();
})();
</script>
</body>
</html>
